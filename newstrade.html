<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Futures — Macro Calendar & Price Impact Analysis</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1E2329;
            --border-color: #2B313A;
            --text-main: #EAECEF;
            --text-muted: #848E9C;
            --accent: #F0B90B;
            --blue: #2962FF;
            --purple: #9C27B0;
            --red: #F6465D;
            --green: #0ECB81;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        select, button {
            background-color: #2B313A;
            color: var(--text-main);
            border: 1px solid #474D57;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 15px;
        }

        #chart-container {
            width: 100%;
            height: 680px;
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .event-item {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--accent);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .event-item.upcoming { border-left-color: var(--green); }
        .event-item.past { border-left-color: var(--border-color); opacity: 0.7; }

        .event-info { display: flex; flex-direction: column; }

        .event-date {
            font-weight: bold;
            color: var(--text-muted);
            font-size: 11px;
        }

        .event-title {
            font-size: 12px;
            color: var(--text-main);
            font-weight: 500;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .badge-upcoming { background: rgba(14, 203, 129, 0.2); color: var(--green); }
        .badge-past { background: rgba(132, 142, 156, 0.2); color: var(--text-muted); }

        /* Блок разбора результатов и влияния на цену */
        .details-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
        }

        .impact-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .impact-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .scenario-box {
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.4;
        }

        .bullish { background: rgba(14, 203, 129, 0.1); border-left: 3px solid var(--green); color: #A3E6CD; }
        .bearish { background: rgba(246, 70, 93, 0.1); border-left: 3px solid var(--red); color: #FCA5A5; }

        .legend {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 2;
            font-size: 12px;
            background: rgba(30, 35, 41, 0.85);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Binance Futures — Macro Calendar & Price Impact Analysis</h2>
        <div class="controls">
            <select id="symbol-select">
                <option value="BTCUSDT">BTC/USDT (Bitcoin)</option>
                <option value="PAXGUSDT">PAXG/USDT (Gold Token)</option>
            </select>
            <select id="interval-select">
                <option value="1d" selected>1D (Дневной)</option>
                <option value="4h">4H (4 Часа)</option>
            </select>
            <button id="run-btn">Обновить</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div id="chart-container">
            <div class="legend" id="legend">Загрузка данных...</div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h3>Предстоящие Новости</h3>
                <div class="event-list" id="event-list"></div>
            </div>

            <div class="card">
                <h3>Прогноз результатов и Влияние</h3>
                <div class="details-box" id="details-box">
                    <div style="color: var(--text-muted); text-align: center; padding: 15px 0;">
                        Нажмите на любое событие из списка выше, чтобы открыть сценарии движения цены
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chartElement = document.getElementById('chart-container');
        const legendElement = document.getElementById('legend');
        
        let chart, candlestickSeries;
        let eventLineSeries = [];

        // Актуальное расписание важных новостей 2026 года
        const calendarEvents = [
            { 
                date: '2026-10-01', 
                title: 'Старт Q4 / Пересчет Портфелей', 
                type: 'quarter', 
                status: 'past',
                forecast: 'Ребалансировка',
                bullScenario: 'Крупный заток капитала в крипто-фонды перед закрытием года ("Uptober"). Давит цену BTC вверх.',
                bearScenario: 'Массовая фиксация прибыли фондами после Q3 и выход в кэш. Временный пролив BTC/Золота.'
            },
            { 
                date: '2026-10-02', 
                title: 'NFP США (Рынок Труда)', 
                type: 'macro', 
                status: 'past',
                forecast: 'Прогноз: +160k рабочих мест',
                bullScenario: 'Число мест < 120k: Ослабление рынка труда → ФРС ускоряет снижение ставок → BTC и Золото растут.',
                bearScenario: 'Число мест > 200k: Сильная экономика → Ставки остаются высокими → Доллар (DXY) вверх, BTC/Золото вниз.'
            },
            { 
                date: '2026-10-14', 
                title: 'Инфляция CPI США', 
                type: 'macro', 
                status: 'upcoming',
                forecast: 'Прогноз: 3.1% YoY',
                bullScenario: 'CPI ≤ 2.9% (Ниже прогноза): Инфляция побеждена → Бычий импульс на $BTC (+3..5%) и Золоте (+1.5%).',
                bearScenario: 'CPI ≥ 3.4% (Выше прогноза): Угроза рефляции → Давление продавливает курс BTC вниз к поддержкам.'
            },
            { 
                date: '2026-10-28', 
                title: 'Заседание FOMC / Ставка ФРС', 
                type: 'macro', 
                status: 'upcoming',
                forecast: 'Прогноз: Снижение на -0.25%',
                bullScenario: 'Снижение ставки на 0.25–0.50% + "мягкая" риторика Пауэлла → Вертикальный взлет BTC и Золота.',
                bearScenario: 'Пауза (без изменений) + предупреждение о высокой инфляции → Дамп рисковых активов.'
            },
            { 
                date: '2026-11-06', 
                title: 'NFP США (Ноябрь)', 
                type: 'macro', 
                status: 'upcoming',
                forecast: 'Оценка рынка труда',
                bullScenario: 'Рост безработицы → Капитал перетекает в защитный PAXG (Золото) и твердые активы (BTC).',
                bearScenario: 'Сильный прирост занятости → Сильный доллар давит ценность биткоина.'
            },
            { 
                date: '2026-11-10', 
                title: 'Инфляция CPI (Ноябрь)', 
                type: 'macro', 
                status: 'upcoming',
                forecast: 'Ожидается замедление',
                bullScenario: 'CPI замедляется → Ожидания дальнейшего смягчения политики ФРС питают бычий ралли.',
                bearScenario: 'Рост CPI → Падение покупательской способности и локальный сброс криптовалют.'
            },
            { 
                date: '2026-12-09', 
                title: 'Финальное Заседание FOMC 2026', 
                type: 'macro', 
                status: 'upcoming',
                forecast: 'Финальное решение года',
                bullScenario: 'Подтверждение цикла снижения ставок на 2027 год → "Новогоднее ралли" (Santa Claus Rally).',
                bearScenario: 'Строгая экономическая политика → Фиксация прибылей перед новогодними праздниками.'
            }
        ];

        function initChart() {
            chart = LightweightCharts.createChart(chartElement, {
                width: chartElement.clientWidth,
                height: 680,
                layout: { backgroundColor: '#1E2329', textColor: '#848E9C' },
                grid: { vertLines: { color: '#2B313A' }, horzLines: { color: '#2B313A' } },
                timeScale: { timeVisible: true }
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#0ECB81', downColor: '#F6465D',
                borderDownColor: '#F6465D', borderUpColor: '#0ECB81',
                wickDownColor: '#F6465D', wickUpColor: '#0ECB81',
            });
        }

        async function fetchKlines(symbol, interval) {
            const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=500`;
            const res = await fetch(url);
            const data = await res.json();
            return data.map(d => ({
                time: Math.floor(d[0] / 1000),
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));
        }

        function clearEventLines() {
            eventLineSeries.forEach(s => chart.removeSeries(s));
            eventLineSeries = [];
        }

        function showEventDetails(event) {
            const detailsBox = document.getElementById('details-box');

            detailsBox.innerHTML = `
                <div>
                    <h4 style="margin: 0 0 4px 0; font-size: 14px; color: var(--accent);">${event.title}</h4>
                    <div style="color: var(--text-muted); font-size: 11px;">Дата: <b>${event.date}</b> | ${event.forecast}</div>
                </div>

                <div class="impact-card">
                    <div class="impact-title">Сценарии движения рынка</div>
                    
                    <div class="scenario-box bullish">
                        <b>🟢 Бычий сценарий (Рост BTC / Золота):</b><br>
                        ${event.bullScenario}
                    </div>

                    <div class="scenario-box bearish">
                        <b>🔴 Медвежий сценарий (Падение):</b><br>
                        ${event.bearScenario}
                    </div>
                </div>
            `;
        }

        function renderCalendarOverlay(klines) {
            clearEventLines();

            let markers = [];
            const minTime = klines[0].time;
            const maxTime = klines[klines.length - 1].time;

            calendarEvents.forEach(evt => {
                const evtTimestamp = Math.floor(new Date(evt.date).getTime() / 1000);

                if (evtTimestamp >= minTime && evtTimestamp <= maxTime) {
                    const isUpcoming = evt.status === 'upcoming';
                    const color = isUpcoming ? '#0ECB81' : '#848E9C';

                    markers.push({
                        time: evtTimestamp,
                        position: 'aboveBar',
                        color: color,
                        shape: isUpcoming ? 'arrowDown' : 'circle',
                        text: `${evt.title}`
                    });

                    const lineSeries = chart.addLineSeries({
                        color: color,
                        lineWidth: isUpcoming ? 2 : 1,
                        lineStyle: isUpcoming ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dotted,
                        crosshairMarkerVisible: false,
                        lastValueVisible: false,
                        priceLineVisible: false
                    });

                    const minPrice = Math.min(...klines.map(k => k.low));
                    const maxPrice = Math.max(...klines.map(k => k.high));

                    lineSeries.setData([
                        { time: evtTimestamp, value: minPrice },
                        { time: evtTimestamp, value: maxPrice }
                    ]);

                    eventLineSeries.push(lineSeries);
                }
            });

            candlestickSeries.setMarkers(markers);

            // Заполнение списка новостей
            const listEl = document.getElementById('event-list');
            listEl.innerHTML = calendarEvents.map((e, idx) => `
                <div class="event-item ${e.status}" onclick="selectEvent(${idx})">
                    <div class="event-info">
                        <span class="event-date">${e.date}</span>
                        <span class="event-title">${e.title}</span>
                    </div>
                    <span class="status-badge ${e.status === 'upcoming' ? 'badge-upcoming' : 'badge-past'}">
                        ${e.status === 'upcoming' ? 'Предстоит' : 'Прошло'}
                    </span>
                </div>
            `).join('');
        }

        window.selectEvent = function(index) {
            const evt = calendarEvents[index];
            showEventDetails(evt);

            const evtTimestamp = Math.floor(new Date(evt.date).getTime() / 1000);
            chart.timeScale().setVisibleRange({
                from: evtTimestamp - (86400 * 10),
                to: evtTimestamp + (86400 * 10)
            });
        };

        async function update() {
            const symbol = document.getElementById('symbol-select').value;
            const interval = document.getElementById('interval-select').value;

            legendElement.innerText = `Загрузка ${symbol}...`;

            try {
                const klines = await fetchKlines(symbol, interval);
                candlestickSeries.setData(klines);
                renderCalendarOverlay(klines);
                legendElement.innerText = `${symbol} (${interval}) — Новости и разбор сценариев готовы`;
            } catch (err) {
                console.error(err);
                legendElement.innerText = `Ошибка загрузки данных.`;
            }
        }

        document.getElementById('run-btn').addEventListener('click', update);
        document.getElementById('symbol-select').addEventListener('change', update);
        document.getElementById('interval-select').addEventListener('change', update);

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.clientWidth, height: 680 });
        });

        initChart();
        update();
    </script>
</body>
</html>
