    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1E2329;
            --border-color: #2B313A;
            --text-main: #EAECEF;
            --text-muted: #848E9C;
            --accent: #F0B90B;
            --blue: #2962FF;
            --purple: #9C27B0;
            --red: #F6465D;
            --green: #0ECB81;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        select, button {
            background-color: #2B313A;
            color: var(--text-main);
            border: 1px solid #474D57;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 15px;
        }

        #chart-wrapper {
            position: relative;
            width: 100%;
            height: 680px;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        #labels-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .event-item {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--accent);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .event-item.upcoming { border-left-color: var(--green); }
        .event-item.past { border-left-color: var(--border-color); opacity: 0.7; }

        .event-info { display: flex; flex-direction: column; }

        .event-date {
            font-weight: bold;
            color: var(--text-muted);
            font-size: 11px;
        }

        .event-title {
            font-size: 12px;
            color: var(--text-main);
            font-weight: 500;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .badge-upcoming { background: rgba(14, 203, 129, 0.2); color: var(--green); }
        .badge-past { background: rgba(132, 142, 156, 0.2); color: var(--text-muted); }

        .details-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
        }

        .impact-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

            margin-top: 6px;

            border-radius: 4px;
            font-size: 11px;
            line-height: 1.4;
        }

            z-index: 6;
            font-size: 12px;
            background: rgba(30, 35, 41, 0.85);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);

        function resizeCanvas() {
            overlayCanvas.width = chartElement.clientWidth;
            overlayCanvas.height = chartElement.clientHeight;
        }

        function initChart() {
            chart = LightweightCharts.createChart(chartElement, {
                width: chartElement.clientWidth,
                height: 680,
                layout: { backgroundColor: '#1E2329', textColor: '#848E9C' },
                grid: { vertLines: { color: '#2B313A' }, horzLines: { color: '#2B313A' } },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#0ECB81', downColor: '#F6465D',
                borderDownColor: '#F6465D', borderUpColor: '#0ECB81',
                wickDownColor: '#F6465D', wickUpColor: '#0ECB81',
            });

            chart.timeScale().subscribeVisibleTimeRangeChange(drawOverlayLabels);
            resizeCanvas();
        }

        async function fetchKlines(symbol, interval) {
            const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=500`;
            const res = await fetch(url);
            const data = await res.json();
            return data.map(d => ({
                time: Math.floor(d[0] / 1000),
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));
        }

        function fillFutureWhitespace(klines, lastEventDateStr, interval) {
            if (!klines || klines.length === 0) return klines;

            const stepSec = interval === '4h' ? 14400 : 86400;
            const lastKlineTime = klines[klines.length - 1].time;
            const maxEventTime = Math.floor(new Date(lastEventDateStr + 'T00:00:00Z').getTime() / 1000);

            if (maxEventTime > lastKlineTime) {
                let currentTime = lastKlineTime + stepSec;
                while (currentTime <= maxEventTime + (stepSec * 10)) {
                    klines.push({ time: currentTime });
                    currentTime += stepSec;
                }
            }
            return klines;
        }

        function findClosestTime(klines, targetSec) {
            let closest = klines[0].time;
            let minDiff = Math.abs(targetSec - closest);

            for (let i = 1; i < klines.length; i++) {
                const diff = Math.abs(targetSec - klines[i].time);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = klines[i].time;
                }
            }
            return closest;
        }

        function clearEventLines() {
            eventLineSeries.forEach(s => chart.removeSeries(s));
            eventLineSeries = [];
            mappedEvents = [];
        }

        function drawOverlayLabels() {
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const timeScale = chart.timeScale();

            mappedEvents.forEach((item, index) => {
                const x = timeScale.timeToCoordinate(item.time);
                
                if (x !== null && x >= 0 && x <= overlayCanvas.width) {
                    ctx.save();
                    // Лесенка из 3 уровневых смещений Y для компактности
                    ctx.translate(x, 180 + (index % 3) * 20); 
                    ctx.rotate(-Math.PI / 2);

                    ctx.font = '11px sans-serif';
                    ctx.fillStyle = item.color;
                    ctx.textAlign = 'left';
                    ctx.fillText(item.title, 0, 4);

                    ctx.restore();
                }
            });
        }

        function showEventDetails(event) {
            const detailsBox = document.getElementById('details-box');

            detailsBox.innerHTML = `
                <div>
                    <h4 style="margin: 0 0 4px 0; font-size: 14px; color: var(--accent);">${event.title}</h4>
                    <div style="color: var(--text-muted); font-size: 11px;">Дата: <b>${event.date}</b> | ${event.forecast}</div>
                </div>

                <div class="impact-card">
                    <div class="impact-title">Сценарии движения рынка</div>
                    
                    <div class="scenario-box bullish">
                        <b>🟢 Бычий сценарий (Рост BTC / PAXG / Альтов):</b><br>
                        ${event.bullScenario}
                    </div>

                    <div class="scenario-box bearish">
                        <b>🔴 Медвежий сценарий (Падение):</b><br>
                        ${event.bearScenario}
                    </div>
                </div>
            `;
        }

        function renderCalendarOverlay(klines) {
            clearEventLines();
            candlestickSeries.setMarkers([]);

            const validPrices = klines.filter(k => k.low !== undefined);
            const minPrice = Math.min(...validPrices.map(k => k.low));
            const maxPrice = Math.max(...validPrices.map(k => k.high));

            calendarEvents.forEach(evt => {
                const rawSec = Math.floor(new Date(evt.date + 'T00:00:00Z').getTime() / 1000);
                const exactTime = findClosestTime(klines, rawSec);

                const isUpcoming = evt.status === 'upcoming';
                const isCrypto = evt.type === 'crypto';
                const color = isUpcoming ? (isCrypto ? '#9C27B0' : '#0ECB81') : '#848E9C';

                mappedEvents.push({
                    time: exactTime,
                    title: evt.title,
                    color: color
                });

                const lineSeries = chart.addLineSeries({
                    color: color,
                    lineWidth: isUpcoming ? 2 : 1,
                    lineStyle: isUpcoming ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dotted,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false
                });

                lineSeries.setData([
                    { time: exactTime, value: minPrice },
                    { time: exactTime, value: maxPrice }
                ]);

                eventLineSeries.push(lineSeries);
            });

            drawOverlayLabels();

            const listEl = document.getElementById('event-list');
            listEl.innerHTML = calendarEvents.map((e, idx) => `
                <div class="event-item ${e.status}" onclick="selectEvent(${idx})">
                    <div class="event-info">
                        <span class="event-date">${e.date}</span>
                        <span class="event-title">${e.title}</span>
                    </div>
                    <span class="status-badge ${e.status === 'upcoming' ? 'badge-upcoming' : 'badge-past'}">
                        ${e.status === 'upcoming' ? (e.type === 'crypto' ? 'Крипто' : 'Макро') : 'Прошло'}
                    </span>
                </div>
            `).join('');
        }

        window.selectEvent = function(index) {
            const evt = calendarEvents[index];
            showEventDetails(evt);

            const rawSec = Math.floor(new Date(evt.date + 'T00:00:00Z').getTime() / 1000);
            chart.timeScale().setVisibleRange({
                from: rawSec - (86400 * 7),
                to: rawSec + (86400 * 7)
            });
        };

        async function update() {
            const symbol = document.getElementById('symbol-select').value;
            const interval = document.getElementById('interval-select').value;

            legendElement.innerText = `Загрузка ${symbol}...`;

            try {
                let klines = await fetchKlines(symbol, interval);
                
                const maxDate = calendarEvents.reduce((max, e) => e.date > max ? e.date : max, calendarEvents[0].date);
                klines = fillFutureWhitespace(klines, maxDate, interval);

                candlestickSeries.setData(klines);
                renderCalendarOverlay(klines);
                
                legendElement.innerText = `${symbol} (${interval}) — История и будущие события загружены`;
            } catch (err) {
                console.error(err);
                legendElement.innerText = `Ошибка загрузки данных.`;
            }
        }

        document.getElementById('run-btn').addEventListener('click', update);
        document.getElementById('symbol-select').addEventListener('change', update);
        document.getElementById('interval-select').addEventListener('change', update);

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.clientWidth, height: 680 });
            resizeCanvas();
            drawOverlayLabels();
        });

        initChart();
        update();
    </script>
</body>
</html>
